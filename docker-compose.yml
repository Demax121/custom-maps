services:
  custom_maps_db:
    build:
      context: ./database
      dockerfile: db.Dockerfile
    container_name: custom_maps_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    networks:
      - custom_maps_network
    volumes:
      - custom_maps_db_data:/var/lib/postgresql

  custom_maps_admin:
    build:
      context: ./database
      dockerfile: admin.Dockerfile
    container_name: custom_maps_admin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    restart: unless-stopped
    ports:
      - ${PGADMIN_PORT_EX}:${PGADMIN_PORT_NATIVE}
    volumes:
      - custom_maps_admin_data:/var/lib/pgadmin
    depends_on:
      - custom_maps_db
    networks:
      - custom_maps_network

  custom_maps_frontend:
    # Frontend Vite server
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: custom_maps_frontend
    environment:
      VITE_PORT: ${PORT_REFERENCE}
      VITE_HOST: ${HOST_REFERENCE}
      # API Endpoints
      VITE_MAP_DATA_ENDPOINT: ${VITE_MAP_DATA_ENDPOINT}
      VITE_MARKERS_DATA_ENDPOINT: ${VITE_MARKERS_DATA_ENDPOINT}
      VITE_OVERLAYS_DATA_ENDPOINT: ${VITE_OVERLAYS_DATA_ENDPOINT}
      VITE_ICONS_DATA_ENDPOINT: ${VITE_ICONS_DATA_ENDPOINT}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT_EX}:${FRONTEND_PORT_NATIVE}" # Vite dev server port
    volumes:
      - ./frontend:/app
      - custom_maps_node_modules_cache:/app/node_modules
    depends_on:
      - custom_maps_api
    networks:
      - custom_maps_network

  custom_maps_php:
    build:
      context: ./backend
      dockerfile: php-manager.Dockerfile
    container_name: custom_maps_php
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: unless-stopped
    volumes:
      - ./backend/php:/var/www/php
    depends_on:
      - custom_maps_db
    networks:
      - custom_maps_network

  custom_maps_api:
    # Backend Caddy server
    build:
      context: ./backend
      dockerfile: api.Dockerfile
    container_name: custom_maps_api
    restart: unless-stopped
    ports:
      - "${BACKEND_CADDY_PORT_EX}:${BACKEND_CADDY_PORT_NATIVE}" # Backend API port
    volumes:
      - ./backend/php:/var/www/php
    depends_on:
      - custom_maps_php
    networks:
      - custom_maps_network

  custom_maps_cdn:
    # CDN static assets server
    build:
      context: ./cdn
      dockerfile: Dockerfile
    container_name: custom_maps_cdn
    ports:
      - "${CDN_PORT_EX}:${CDN_PORT_NATIVE}" # CDN static assets port
    volumes:
      - ./cdn/assets:/srv/assets:ro
    networks:
      - custom_maps_network
    restart: unless-stopped



volumes:
  custom_maps_admin_data:
  custom_maps_node_modules_cache:
  custom_maps_db_data:

networks:
  custom_maps_network:
    driver: bridge
