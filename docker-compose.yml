services:
  custom_maps_db:
    build:
      context: ./postgreSQL
      dockerfile: postgresDB.Dockerfile
      args:
        DB_USER: ${POSTGRES_USER}
        DB_PASSWORD: ${POSTGRES_PASSWORD}
    container_name: custom_maps_db
    environment:
      POSTGRES_DB: maps_db
    restart: unless-stopped
    networks:
      - custom_maps_network

  custom_maps_admin:
    build:
      context: ./postgreSQL
      dockerfile: pgAdmin.Dockerfile
      args:
        PGADMIN_EMAIL: ${PGADMIN_EMAIL}
        PGADMIN_PASSWORD: ${PGADMIN_PASSWORD}
    container_name: custom_maps_admin
    restart: unless-stopped
    ports:
      - ${PGADMIN_PORT_EX}:${PGADMIN_PORT_NATIVE}
    volumes:
      - custom_maps_admin_data:/var/lib/pgadmin
    depends_on:
      - custom_maps_db
    networks:
      - custom_maps_network

  custom_maps_frontend:
    # Frontend Vite server
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
      args:
        PORT_REFERENCE: ${PORT_REFERENCE}
        HOST_REFERENCE: ${HOST_REFERENCE}
    container_name: custom_maps_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT_EX}:${FRONTEND_PORT_NATIVE}" # Vite dev server port
    volumes:
      - ./frontend:/app
      - custom_maps_node_modules_cache:/app/node_modules
    depends_on:
      - custom_maps_api
    networks:
      - custom_maps_network

  custom_maps_php:
    build:
      context: ./backend
      dockerfile: php-manager.Dockerfile
      args:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
    container_name: custom_maps_php
    restart: unless-stopped
    volumes:
      - ./backend/php:/var/www/php
    depends_on:
      - custom_maps_db
    networks:
      - custom_maps_network

  custom_maps_api:
    # Backend Caddy server
    build:
      context: ./backend
      dockerfile: caddy-server.Dockerfile
    container_name: custom_maps_api
    restart: unless-stopped
    ports:
      - "${BACKEND_CADDY_PORT_EX}:${BACKEND_CADDY_PORT_NATIVE}" # Backend API port
    volumes:
      - ./backend/php:/var/www/php
    depends_on:
      - custom_maps_php
    networks:
      - custom_maps_network

  custom_maps_cdn:
    # CDN static assets server
    build:
      context: ./CDN
      dockerfile: caddy-cdn.Dockerfile
    container_name: custom_maps_cdn
    ports:
      - "${CDN_PORT_EX}:${CDN_PORT_NATIVE}" # CDN static assets port
    volumes:
      - ./CDN/assets:/srv/assets:ro
    networks:
      - custom_maps_network
    restart: unless-stopped



volumes:
  custom_maps_admin_data:
  custom_maps_node_modules_cache:

networks:
  custom_maps_network:
    driver: bridge
